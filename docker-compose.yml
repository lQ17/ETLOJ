services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: etloj
      MARIADB_USER: etloj
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gojudge:
    image: criyle/go-judge:v1.9.0
    restart: unless-stopped
    privileged: true
    shm_size: 256m
    command: ["-http-addr", "0.0.0.0:5050", "-parallelism", "2", "-silent"]
    expose:
      - "5050"
    networks:
      - sandbox

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://etloj:${MYSQL_PASSWORD}@mariadb:3306/etloj
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JUDGE_SECRET: ${JUDGE_SECRET:?set JUDGE_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD}
      PROBLEMS_DIR: /data/problems
      CLIENT_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MCP_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      MCP_TESTCASE_MAX_FILE_BYTES: ${MCP_TESTCASE_MAX_FILE_BYTES:-1048576}
      MCP_TESTCASE_READ_CHUNK_CHARS: ${MCP_TESTCASE_READ_CHUNK_CHARS:-32768}
      MCP_TESTCASE_READ_MAX_CHARS: ${MCP_TESTCASE_READ_MAX_CHARS:-65536}
      MCP_TESTCASE_MAX_COUNT: ${MCP_TESTCASE_MAX_COUNT:-1000}
      MCP_ADMIN_WRITE_RATE_LIMIT_MAX: ${MCP_ADMIN_WRITE_RATE_LIMIT_MAX:-10}
      MCP_ADMIN_WRITE_RATE_LIMIT_WINDOW_MS: ${MCP_ADMIN_WRITE_RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - ./data/problems:/data/problems
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge:
    build:
      context: .
      dockerfile: docker/judge.Dockerfile
    restart: unless-stopped
    environment:
      JUDGE_MODE: go-judge
      REDIS_URL: redis://redis:6379
      GO_JUDGE_URL: http://gojudge:5050
      SERVER_URL: http://server:3000
      JUDGE_SECRET: ${JUDGE_SECRET:?set JUDGE_SECRET}
    networks:
      - backend
      - sandbox
    depends_on:
      redis:
        condition: service_healthy
      gojudge:
        condition: service_started
      server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - frontend
    depends_on:
      server:
        condition: service_started

volumes:
  mariadb_data:
  redis_data:

networks:
  frontend:
  backend:
    internal: true
  sandbox:
    internal: true
